<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منطقة العمل - سديم</title>
    <link rel="stylesheet" href="../../styles/global.css">
    <style>
        .workspace-container {
            padding: 80px 30px 30px 30px;
            height: 100vh;
            overflow-y: auto;
            animation: fadeIn 0.5s ease;
        }

        .workspace-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            animation: slideInDown 0.5s ease;
            flex-wrap: wrap;
            gap: 15px;
        }

        .workspace-title {
            font-size: 28px;
            font-weight: 300;
            color: #F5F5F5;
        }

        .workspace-title span {
            color: #C8D5E0;
            background: linear-gradient(90deg, #C8D5E0, #E8EDF2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .workspace-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-workspace {
            padding: 10px 20px;
            background: #2B2D42;
            color: #F5F5F5;
            border: 1px solid #C8D5E0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .btn-workspace:hover:not(:disabled) {
            background: #E8EDF2;
            color: #0A0A0A;
            transform: translateY(-2px);
        }

        .btn-workspace:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .workspace-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .workspace-card {
            background: rgba(28, 28, 30, 0.8);
            border: 1px solid rgba(200, 213, 224, 0.08);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
            min-height: 300px;
        }

        .workspace-card:hover {
            border-color: rgba(200, 213, 224, 0.15);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .workspace-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .workspace-card .card-title {
            color: #F5F5F5;
            font-size: 16px;
            font-weight: 600;
        }

        .workspace-card .card-actions {
            display: flex;
            gap: 8px;
        }

        .workspace-card .card-actions button {
            padding: 4px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .workspace-card .card-actions .btn-edit {
            background: rgba(43, 45, 66, 0.3);
            color: #E8EDF2;
        }

        .workspace-card .card-actions .btn-edit:hover:not(:disabled) {
            background: rgba(43, 45, 66, 0.6);
        }

        .workspace-card .card-actions .btn-delete {
            background: rgba(255, 107, 107, 0.15);
            color: #ff6b6b;
        }

        .workspace-card .card-actions .btn-delete:hover:not(:disabled) {
            background: rgba(255, 107, 107, 0.3);
        }

        .workspace-card .card-actions .btn-move {
            background: rgba(33, 150, 243, 0.15);
            color: #2196F3;
        }

        .workspace-card .card-actions .btn-move:hover:not(:disabled) {
            background: rgba(33, 150, 243, 0.3);
        }

        .workspace-card .field-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .workspace-card .field-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: rgba(10, 10, 10, 0.4);
            border-radius: 6px;
            border: 1px solid rgba(200, 213, 224, 0.05);
            transition: all 0.3s ease;
            cursor: grab;
        }

        .workspace-card .field-item:hover {
            border-color: rgba(200, 213, 224, 0.15);
            background: rgba(43, 45, 66, 0.1);
        }

        .workspace-card .field-item .drag-handle {
            color: #9BA5AF;
            font-size: 16px;
            cursor: grab;
        }

        .workspace-card .field-item .field-label {
            color: #F5F5F5;
            font-size: 14px;
            flex: 1;
        }

        .workspace-card .field-item .field-type {
            color: #9BA5AF;
            font-size: 11px;
            padding: 2px 10px;
            background: rgba(200, 213, 224, 0.05);
            border-radius: 12px;
        }

        .workspace-card .field-item .field-actions {
            display: flex;
            gap: 4px;
        }

        .workspace-card .field-item .field-actions button {
            background: none;
            border: none;
            color: #9BA5AF;
            cursor: pointer;
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .workspace-card .field-item .field-actions button:hover {
            background: rgba(200, 213, 224, 0.1);
            color: #F5F5F5;
        }

        .workspace-card .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .workspace-card .image-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(200, 213, 224, 0.05);
            aspect-ratio: 1;
            background: rgba(10, 10, 10, 0.4);
        }

        .workspace-card .image-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .workspace-card .image-item .image-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .workspace-card .image-item:hover .image-overlay {
            opacity: 1;
        }

        .workspace-card .image-item .image-overlay button {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .workspace-card .image-item .image-overlay button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .workspace-card .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #9BA5AF;
        }

        .workspace-card .empty-state .empty-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 10px;
            opacity: 0.5;
        }

        .workspace-card .empty-state .empty-text {
            font-size: 14px;
        }

        .workspace-card .add-field-btn {
            width: 100%;
            padding: 10px;
            background: rgba(43, 45, 66, 0.2);
            border: 1px dashed rgba(200, 213, 224, 0.15);
            border-radius: 8px;
            color: #9BA5AF;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            margin-top: 10px;
        }

        .workspace-card .add-field-btn:hover:not(:disabled) {
            background: rgba(43, 45, 66, 0.3);
            color: #F5F5F5;
        }

        .workspace-card .add-image-btn {
            padding: 8px 16px;
            background: rgba(43, 45, 66, 0.2);
            border: 1px dashed rgba(200, 213, 224, 0.15);
            border-radius: 8px;
            color: #9BA5AF;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Cairo', sans-serif;
            font-size: 13px;
        }

        .workspace-card .add-image-btn:hover:not(:disabled) {
            background: rgba(43, 45, 66, 0.3);
            color: #F5F5F5;
        }

        /* ========================================
           مودال الإضافة
           ======================================== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: #1C1C1E;
            border-radius: 16px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(200, 213, 224, 0.08);
            animation: slideUp 0.3s ease;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            color: #F5F5F5;
            font-size: 20px;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            color: #9BA5AF;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            color: #F5F5F5;
            transform: rotate(90deg);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            color: #9BA5AF;
            font-size: 14px;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .form-input {
            width: 100%;
            padding: 10px 15px;
            background: rgba(10, 10, 10, 0.6);
            border: 1px solid rgba(200, 213, 224, 0.15);
            border-radius: 8px;
            color: #F5F5F5;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #2B2D42;
            box-shadow: 0 0 0 3px rgba(43, 45, 66, 0.15);
        }

        .form-select {
            width: 100%;
            padding: 10px 15px;
            background: rgba(10, 10, 10, 0.6);
            border: 1px solid rgba(200, 213, 224, 0.15);
            border-radius: 8px;
            color: #F5F5F5;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .form-select:focus {
            outline: none;
            border-color: #2B2D42;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(200, 213, 224, 0.08);
        }

        .btn-submit {
            padding: 10px 30px;
            background: #2B2D42;
            color: #F5F5F5;
            border: 1px solid #C8D5E0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-submit:hover:not(:disabled) {
            background: #E8EDF2;
            color: #0A0A0A;
            transform: translateY(-2px);
        }

        .btn-cancel {
            padding: 10px 30px;
            background: transparent;
            color: #9BA5AF;
            border: 1px solid rgba(200, 213, 224, 0.15);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-cancel:hover {
            border-color: #9BA5AF;
            color: #F5F5F5;
        }

        /* ========================================
           أزرار النافذة
           ======================================== */
        .window-controls {
            position: fixed;
            top: 0;
            right: 0;
            z-index: 10000;
            display: flex;
            gap: 10px;
            padding: 12px 20px;
            background: rgba(10, 10, 10, 0.3);
            backdrop-filter: blur(10px);
            -webkit-app-region: drag;
            border-bottom-left-radius: 12px;
            user-select: none;
        }

        .window-controls button {
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            color: #9BA5AF;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-app-region: no-drag;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            backdrop-filter: blur(5px);
        }

        .window-controls button:hover {
            background: rgba(200, 213, 224, 0.15);
            color: #F5F5F5;
            transform: scale(1.05);
        }

        .window-controls .close-btn:hover {
            background: #ff4757;
            color: white;
            transform: scale(1.1);
        }

        .window-controls .minimize-btn:hover {
            background: rgba(43, 45, 66, 0.6);
        }

        .window-controls .maximize-btn:hover {
            background: rgba(43, 45, 66, 0.6);
        }

        .window-controls button svg {
            width: 14px;
            height: 14px;
        }

        /* ========================================
           التجاوب مع الشاشات
           ======================================== */
        @media (max-width: 992px) {
            .workspace-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .workspace-container {
                padding: 70px 15px 15px 15px;
            }

            .workspace-header {
                flex-direction: column;
                align-items: stretch;
            }

            .workspace-card {
                padding: 15px;
            }

            .workspace-card .image-grid {
                grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            }

            .window-controls {
                padding: 10px 15px;
                gap: 8px;
            }

            .window-controls button {
                width: 30px;
                height: 30px;
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            .workspace-title {
                font-size: 22px;
            }

            .workspace-actions {
                flex-direction: column;
            }

            .workspace-actions .btn-workspace {
                width: 100%;
                justify-content: center;
            }

            .modal-content {
                padding: 20px;
                width: 95%;
            }

            .window-controls {
                padding: 8px 12px;
                gap: 6px;
            }

            .window-controls button {
                width: 26px;
                height: 26px;
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- ========================================
         أزرار التحكم في النافذة
         ======================================== -->
    <div class="window-controls">
        <button class="minimize-btn" id="minimizeBtn" title="تصغير">
            <svg viewBox="0 0 12 12">
                <rect x="0" y="5" width="12" height="2" fill="currentColor"/>
            </svg>
        </button>
        <button class="maximize-btn" id="maximizeBtn" title="تكبير">
            <svg viewBox="0 0 12 12">
                <rect x="0" y="0" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5"/>
            </svg>
        </button>
        <button class="close-btn" id="closeBtn" title="إغلاق">
            <svg viewBox="0 0 12 12">
                <line x1="2" y1="2" x2="10" y2="10" stroke="currentColor" stroke-width="1.5"/>
                <line x1="10" y1="2" x2="2" y2="10" stroke="currentColor" stroke-width="1.5"/>
            </svg>
        </button>
    </div>

    <div class="workspace-container">
        <div class="workspace-header">
            <h1 class="workspace-title">🔧 منطقة <span>العمل</span></h1>
            <div class="workspace-actions">
                <button class="btn-workspace" id="addWorkspaceBtn">➕ إضافة مجموعة</button>
                <button class="btn-workspace" id="exportWorkspaceBtn">📊 تصدير</button>
                <button class="btn-workspace" id="printWorkspaceBtn">🖨️ طباعة</button>
            </div>
        </div>

        <div class="workspace-grid" id="workspaceGrid">
            <!-- سيتم إنشاء المجموعات بواسطة JavaScript -->
        </div>
    </div>

    <!-- Modal for Add Workspace Group -->
    <div class="modal-overlay" id="workspaceModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">إضافة مجموعة جديدة</h2>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <form id="workspaceForm">
                <div class="form-group">
                    <label class="form-label">اسم المجموعة</label>
                    <input type="text" class="form-input" id="groupName" placeholder="مثال: بيانات المنتج" required>
                </div>
                <div class="form-group">
                    <label class="form-label">نوع المجموعة</label>
                    <select class="form-select" id="groupType">
                        <option value="fields">حقول البيانات</option>
                        <option value="images">الصور</option>
                        <option value="mixed">مختلط</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-cancel" id="cancelBtn">إلغاء</button>
                    <button type="submit" class="btn-submit">إنشاء</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal for Add Field -->
    <div class="modal-overlay" id="fieldModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="fieldModalTitle">إضافة حقل جديد</h2>
                <button class="modal-close" id="fieldModalClose">&times;</button>
            </div>
            <form id="fieldForm">
                <input type="hidden" id="fieldGroupId">
                <div class="form-group">
                    <label class="form-label">اسم الحقل</label>
                    <input type="text" class="form-input" id="fieldName" placeholder="مثال: اسم المنتج" required>
                </div>
                <div class="form-group">
                    <label class="form-label">نوع الحقل</label>
                    <select class="form-select" id="fieldType">
                        <option value="text">نص</option>
                        <option value="number">رقم</option>
                        <option value="date">تاريخ</option>
                        <option value="email">بريد إلكتروني</option>
                        <option value="phone">هاتف</option>
                        <option value="textarea">نص طويل</option>
                        <option value="select">قائمة منسدلة</option>
                        <option value="checkbox">خانة اختيار</option>
                        <option value="image">صورة</option>
                    </select>
                </div>
                <div class="form-group" id="fieldOptionsGroup" style="display: none;">
                    <label class="form-label">الخيارات (افصل بينها بفاصلة)</label>
                    <input type="text" class="form-input" id="fieldOptions" placeholder="خيار1, خيار2, خيار3">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-cancel" id="fieldCancelBtn">إلغاء</button>
                    <button type="submit" class="btn-submit">إضافة</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../../utils/navigation.js"></script>
    <script src="../../utils/database-helper.js"></script>
    <script src="./workspace.js"></script>
</body>
</html>
